<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lucid — think it through, not just write it down</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#141319; --surface:#1E1C26; --surface2:#282631;
  --line:#332F3D; --line-soft:#2A2733;
  --text:#EFEDF4; --muted:#928DA2; --faint:#615D70;
  --accent:#8F90FF; --accent-dim:#8f90ff20; --accent-line:#8f90ff40;
  --warm:#CBA46A; --good:#69D6A6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(130% 55% at 50% -8%, #241f33 0%, var(--bg) 52%);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100%;}
.phone{width:100%;max-width:440px;min-height:100vh;position:relative;display:flex;flex-direction:column;padding:0 18px;overflow:hidden;}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:24px 2px 6px;}
.brand{display:flex;align-items:center;gap:11px;}
.badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#181425;background:linear-gradient(158deg,#9fa0ff,#6f71ff);box-shadow:0 6px 16px -6px #7476ffaa,0 0 0 1px #ffffff2a inset;flex:none;}
.brandtype{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.035em;line-height:1;}
.brandtype .sub{font-weight:500;color:var(--muted);letter-spacing:-.02em;}
.tag{font-size:13px;color:var(--muted);padding:14px 2px 18px;letter-spacing:-.01em;min-height:19px;}

.lens-wrap{position:relative;}
.lens-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;cursor:pointer;transition:border-color .15s;}
.lens-chip:hover{border-color:var(--accent-line);}
.lens-chip .ic{color:var(--accent);}
.lens-menu{position:absolute;right:0;top:44px;z-index:40;width:224px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 24px 60px -20px #000b;animation:pop .16s ease;}
.lens-opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:10px 11px;border-radius:11px;color:var(--text);}
.lens-opt:hover{background:#ffffff09;}
.lens-opt.on{background:var(--accent-dim);}
.lens-opt-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;}
.lens-opt-top .ic{color:var(--accent);}
.lens-opt-hint{font-size:11.5px;color:var(--muted);}

.feed{flex:1;overflow-y:auto;padding-top:2px;}
.feed-pad{height:132px;}
.grp{margin-bottom:26px;}
.grp-h{display:flex;align-items:center;gap:9px;padding:0 4px 11px;}
.grp-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.grp-line{flex:1;height:1px;background:var(--line-soft);}
.grp-count{font-size:11px;color:var(--accent);font-weight:600;}
.grp.done-grp .grp-name{color:var(--faint);}
.grp.done-grp .grp-count{color:var(--faint);}

.card{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:16px 17px;margin-bottom:11px;transition:transform .12s,border-color .15s;}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px);}
.card:active{transform:scale(.99);}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.card-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.025em;line-height:1.25;}
.card-right{display:flex;align-items:center;gap:9px;flex:none;}
.card-play{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all .15s;}
.card-play:hover{color:var(--accent);border-color:var(--accent-line);}
.card-play.playing{background:var(--good);border-color:var(--good);color:#10231c;}
.card-time{font-size:11px;color:var(--faint);white-space:nowrap;}
.card-thesis{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{display:flex;align-items:center;gap:10px;margin-top:13px;}
.meta-act{font-size:11.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;}
.meta-act::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);}
.meta-quick{font-size:11px;font-weight:600;color:var(--warm);display:flex;align-items:center;gap:6px;}
.meta-quick::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--warm);}

/* tasks */
.task-row{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:15px;padding:13px 15px;margin-bottom:9px;transition:background .15s,border-color .15s;}
.task-row.done{background:transparent;border-color:transparent;padding:7px 15px;margin-bottom:2px;}
.tcheck{flex:none;width:23px;height:23px;border-radius:8px;border:1.6px solid var(--accent-line);background:var(--accent-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#181425;margin-top:1px;transition:all .15s;}
.tcheck:active{transform:scale(.9);}
.tcheck.on{background:var(--good);border-color:var(--good);}
.task-main{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;flex:1;min-width:0;background:none;border:none;padding:0;}
.task-text{font-size:14.5px;line-height:1.4;color:var(--text);}
.task-row.done .task-text{color:var(--faint);text-decoration:line-through;}
.task-src{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tasks-lead{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px 12px;}

.empty-state{text-align:center;padding:56px 24px 40px;color:var(--muted);}
.badge.lg{width:66px;height:66px;border-radius:21px;margin:0 auto 24px;}
.empty-state h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:var(--text);letter-spacing:-.025em;margin-bottom:9px;}
.empty-state p{font-size:13.5px;line-height:1.55;max-width:290px;margin:0 auto;}

.fab{position:fixed;right:18px;bottom:80px;width:56px;height:56px;border-radius:18px;border:none;cursor:pointer;background:linear-gradient(160deg,#9fa0ff,#7476ff);color:#181425;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -8px #7476ffc0,0 0 0 1px #ffffff26 inset;transition:transform .15s;z-index:20;}
.fab:hover{transform:translateY(-2px);}
.fab:active{transform:scale(.94);}

/* bottom tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:440px;height:64px;display:flex;align-items:stretch;background:rgba(20,19,25,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);z-index:15;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--faint);font-size:10.5px;font-weight:600;font-family:'Inter',sans-serif;transition:color .15s;}
.tab.on{color:var(--accent);}
.proj-card{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:16px 17px;margin-bottom:11px;transition:transform .12s,border-color .15s;}
.proj-card:hover{border-color:var(--accent-line);transform:translateY(-1px);}
.proj-card:active{transform:scale(.99);}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.proj-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.025em;line-height:1.2;}
.proj-chev{color:var(--faint);display:flex;flex:none;}
.proj-meta{font-size:12.5px;color:var(--muted);margin-top:6px;}
.proj-bar{height:5px;border-radius:999px;background:var(--line-soft);margin-top:13px;overflow:hidden;}
.proj-bar span{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s;}
.backrow{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;padding:2px 2px 14px;}
.backrow:hover{color:var(--text);}
.lib-controls{display:flex;flex-direction:column;gap:11px;padding:0 0 16px;}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;transition:border-color .15s;}
.searchbar:focus-within{border-color:var(--accent-line);}
.searchbar .ic{color:var(--muted);flex:none;}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;min-width:0;}
.searchbar input::placeholder{color:var(--faint);}
.searchbar .clr{background:none;border:none;color:var(--muted);cursor:pointer;display:none;padding:0;align-items:center;}
.searchbar .clr.show{display:flex;}
.seg{display:flex;gap:5px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line-soft);}
.seg button{flex:1;padding:8px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:9px;font-family:'Inter',sans-serif;transition:all .15s;}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:0 2px 8px -2px #0007;}
.lib-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;padding:52px 24px;}
.meta-proj{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:2px 9px;border-radius:999px;}
.hdr-actions{display:flex;align-items:center;gap:9px;}
.icon-btn.ghost{background:var(--surface);}
.toolbar{display:flex;align-items:center;justify-content:flex-end;}
.sort-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s;}
.sort-pill:hover{border-color:var(--accent-line);}
.sort-pill .ic{color:var(--accent);}
.newfolder-btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:13px;font-weight:600;padding:8px 13px;border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.newfolder-btn:hover{color:var(--accent);border-color:var(--accent-line);}
.newfolder-btn .ic{color:var(--accent);}
.newfolder-row{display:flex;gap:7px;align-items:center;}
.newfolder-row input{flex:1;background:var(--bg);border:1px solid var(--accent-line);border-radius:11px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;min-width:0;}
.newfolder-row input::placeholder{color:var(--faint);}
.pill-btn{background:linear-gradient(160deg,#9fa0ff,#7476ff);color:#181425;border:none;padding:9px 15px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;flex:none;}
.pill-btn.ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
.mcard{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;margin-bottom:11px;overflow:hidden;}
.mcard.drag{opacity:.55;border-color:var(--accent-line);}
.grip{flex:none;width:42px;background:none;border:none;color:var(--faint);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;}
.grip:active{cursor:grabbing;}
.mcard-body{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;color:var(--text);padding:15px 16px 15px 2px;}
.file-row{margin-top:22px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.chip{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.chip.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent);}
.folder-tools{display:flex;gap:8px;margin-bottom:16px;}
.set-row{display:flex;align-items:center;gap:13px;width:100%;background:var(--bg);border:1px solid var(--line-soft);border-radius:14px;padding:14px 15px;margin-bottom:9px;cursor:pointer;color:var(--text);text-align:left;font-family:'Inter',sans-serif;transition:border-color .15s;}
.set-row:hover{border-color:var(--accent-line);}
.set-ic{flex:none;color:var(--accent);display:flex;}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.set-title{font-size:14.5px;font-weight:600;}
.set-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}
.set-note{font-size:12px;color:var(--faint);line-height:1.55;padding:14px 4px 2px;}
.expand-row{margin-top:24px;display:flex;gap:8px;}
.expand-btn{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;padding:13px;cursor:pointer;background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent);border-radius:14px;font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;transition:background .15s;}
.expand-btn:hover{background:#8f90ff33;}
.listen-btn{display:flex;align-items:center;justify-content:center;gap:8px;flex:none;padding:13px 18px;cursor:pointer;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:14px;font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s;}
.listen-btn:hover{border-color:var(--accent-line);}
.listen-btn.playing{background:var(--good);border-color:var(--good);color:#10231c;}
.tab-ic{position:relative;display:flex;}
.tab-badge{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#181425;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg);}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;z-index:120;box-shadow:0 12px 30px -10px #000b;animation:pop .18s ease;}

.scrim{position:fixed;inset:0;z-index:100;background:#08070ecc;backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;}
.sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:28px 28px 0 0;padding:10px 20px 30px;animation:rise .28s cubic-bezier(.2,.9,.25,1);max-height:88vh;overflow-y:auto;}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 16px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;}
.icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{color:var(--text);}

.sheet-lens{display:flex;gap:5px;background:var(--bg);padding:4px;border-radius:13px;margin-bottom:24px;border:1px solid var(--line-soft);}
.lens-seg{flex:1;padding:9px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:10px;transition:all .15s;}
.lens-seg.on{background:var(--surface2);color:var(--text);box-shadow:0 2px 8px -2px #0007;}

.cap-idle{text-align:center;padding:16px 0 8px;}
.rec-btn{width:98px;height:98px;border-radius:50%;cursor:pointer;border:1px solid var(--accent-line);background:radial-gradient(circle at 50% 38%,#8f90ff38,#1e1c26);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;transition:transform .15s;}
.rec-btn::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--accent-line);opacity:.45;}
.rec-btn:active{transform:scale(.97);}
.cap-hint{font-size:13.5px;color:var(--muted);margin-top:22px;}
.cap-hint.dim{color:var(--faint);}
.text-alt{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;padding:6px;}
.text-alt:hover{color:var(--accent);}

.live-transcript{min-height:132px;max-height:220px;overflow-y:auto;background:var(--bg);border:1px solid var(--line-soft);border-radius:16px;padding:16px;}
.live-transcript p{font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.75;letter-spacing:-.01em;}
.live-transcript .interim{color:var(--muted);}
.live-transcript .ghost{color:var(--faint);}
.bars{display:flex;gap:4px;justify-content:center;height:34px;align-items:center;margin:22px 0 8px;}
.bars span{width:4px;height:8px;border-radius:999px;background:var(--accent);animation:bar 1s ease-in-out infinite;}
.stop-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:8px;padding:15px;cursor:pointer;background:linear-gradient(160deg,#9fa0ff,#7476ff);color:#181425;border:none;border-radius:15px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;box-shadow:0 10px 26px -10px #7476ffaa;}

.cap-type textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:15px;color:var(--text);resize:none;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.65;outline:none;transition:border-color .15s;}
.cap-type textarea:focus{border-color:var(--accent-line);}
.cap-type textarea::placeholder{color:var(--faint);}
.type-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.primary-btn{display:flex;align-items:center;gap:8px;margin-left:auto;background:linear-gradient(160deg,#9fa0ff,#7476ff);color:#181425;border:none;padding:12px 20px;border-radius:13px;cursor:pointer;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;box-shadow:0 10px 26px -10px #7476ffaa;}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

.cap-refining{text-align:center;padding:22px 0 12px;}
.orbit{width:72px;height:72px;border-radius:24px;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--accent-line);background:radial-gradient(circle,#8f90ff26,transparent);animation:breathe 1.6s ease-in-out infinite;}
.refine-lines{display:flex;flex-direction:column;gap:12px;padding:0 8px;}
.shimmer-line{height:13px;border-radius:6px;background:linear-gradient(90deg,#2a2733 0%,#39364a 50%,#2a2733 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
.shimmer-line.short{width:55%;}

.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;}
.detail-project{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
.detail-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.035em;line-height:1.13;margin-top:7px;}
.detail-thesis{font-size:16px;line-height:1.5;font-weight:450;padding-bottom:18px;border-bottom:1px solid var(--line-soft);margin-bottom:18px;letter-spacing:-.01em;}
.points{list-style:none;display:flex;flex-direction:column;gap:14px;}
.points li{display:flex;gap:12px;font-size:14.5px;line-height:1.5;}
.points .bullet{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;}
.actions-block{margin-top:22px;background:var(--bg);border:1px solid var(--line-soft);border-radius:16px;padding:10px 15px;}
.block-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin:8px 0 6px;}
.action-row{display:flex;align-items:flex-start;gap:11px;font-size:14px;line-height:1.45;padding:9px 0;width:100%;background:none;border:none;text-align:left;color:var(--text);cursor:pointer;border-bottom:1px solid var(--line-soft);}
.action-row:last-child{border-bottom:none;}
.acheck{flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--accent-line);background:var(--accent-dim);margin-top:0;display:flex;align-items:center;justify-content:center;color:#181425;transition:all .15s;}
.acheck.on{background:var(--good);border-color:var(--good);}
.action-row.done span:last-child{color:var(--faint);text-decoration:line-through;}
.raw-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:22px;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;padding:4px 0;}
.raw-toggle:hover{color:var(--text);}
.raw-text{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;color:var(--warm);background:#cba46a0d;border-left:2px solid #cba46a55;padding:12px 14px;border-radius:0 10px 10px 0;}
.detail-actions{display:flex;gap:8px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft);}
.mini-btn{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;transition:border-color .15s;}
.mini-btn:hover{border-color:var(--accent-line);}
.mini-btn.danger{flex:none;width:46px;color:var(--muted);}
.mini-btn.danger.on{flex:1;color:#ff8a8a;border-color:#ff8a8a44;background:#ff8a8a14;}

.sugg-block{border:1px dashed var(--line);background:transparent;}
.sugg-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
.sugg-row:last-child{border-bottom:none;}
.sugg-text{flex:1;font-size:14px;line-height:1.45;color:var(--muted);}
.sugg-btns{display:flex;align-items:center;gap:4px;flex:none;}
.sugg-add{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;}
.sugg-add:hover{background:#8f90ff33;}
.sugg-no{background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;display:flex;}
.sugg-no:hover{color:#ff8a8a;}
.meta-sugg{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;}
.meta-sugg::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);}
.addtask-row{display:flex;gap:7px;align-items:center;margin-bottom:14px;}
.addtask-row input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;min-width:0;transition:border-color .15s;}
.addtask-row input:focus{border-color:var(--accent-line);}
.addtask-row input::placeholder{color:var(--faint);}
.addtask-row .pill-btn{display:flex;align-items:center;justify-content:center;padding:11px 14px;}
.solo-del{flex:none;background:none;border:none;color:var(--faint);cursor:pointer;padding:2px 0 0 4px;display:flex;align-items:flex-start;}
.solo-del:hover{color:#ff8a8a;}
.detail-title{cursor:text;}

/* businesses (ventures) */
.vcard{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;margin-bottom:11px;overflow:hidden;transition:border-color .15s;}
.vcard:hover{border-color:var(--accent-line);}
.vcard.drag{opacity:.55;border-color:var(--accent-line);}
.vcard-body{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;color:var(--text);padding:15px 16px 15px 2px;font-family:'Inter',sans-serif;}
.kind-badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;flex:none;}
.kind-badge.run{background:#69d6a61f;color:var(--good);border:1px solid #69d6a63d;}
.kind-badge.idea{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-line);}
.kind-select{background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:13px;font-family:'Inter',sans-serif;border-radius:11px;padding:9px 8px;outline:none;flex:none;}
.stand-block{background:var(--bg);border:1px solid var(--line-soft);border-radius:16px;padding:15px 16px;margin-bottom:16px;}
.stand-lead{font-size:14.5px;line-height:1.55;color:var(--text);margin-top:4px;}

/* thinking-partner sections: questions / angles / risks */
.dev-block{margin-top:18px;border-left:2px solid var(--line);padding:2px 0 2px 14px;}
.dev-block.q{border-color:var(--accent);}
.dev-block.a{border-color:var(--warm);}
.dev-block.r{border-color:#E0857A;}
.dev-block .block-label{margin:0 0 8px;}
.dev-block.q .block-label{color:var(--accent);}
.dev-block.a .block-label{color:var(--warm);}
.dev-block.r .block-label{color:#E0857A;}
.dev-list{list-style:none;display:flex;flex-direction:column;gap:9px;}
.dev-list li{font-size:14px;line-height:1.5;color:var(--text);}
.mine-tag{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

/* go-deeper thread */
.thread-wrap{margin-top:20px;border-top:1px solid var(--line-soft);padding-top:16px;}
.thread{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding:2px 0 4px;}
.thread::-webkit-scrollbar{width:0;}
.msg{font-size:14px;line-height:1.55;padding:11px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;}
.msg.me{align-self:flex-end;background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--text);border-bottom-right-radius:5px;}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:5px;}
.msg.thinking{color:var(--muted);font-style:italic;}
.thread-empty{font-size:13px;color:var(--faint);line-height:1.5;padding:2px 0 6px;}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.starter{background:var(--bg);border:1px dashed var(--line);color:var(--muted);font-size:12px;font-weight:500;padding:7px 11px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;line-height:1.35;max-width:100%;transition:all .15s;}
.starter:hover{color:var(--accent);border-color:var(--accent-line);}
.thread-input{display:flex;gap:7px;align-items:center;margin-top:12px;}
.thread-input input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;min-width:0;transition:border-color .15s;}
.thread-input input:focus{border-color:var(--accent-line);}
.thread-input input::placeholder{color:var(--faint);}
.thread-input .pill-btn:disabled{opacity:.4;cursor:not-allowed;}
.meta-q{font-size:11px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;}
.meta-q::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);}

@keyframes bar{0%,100%{height:8px;}50%{height:30px;}}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
@keyframes rise{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8;}50%{transform:scale(1.08);opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;}
.feed::-webkit-scrollbar,.live-transcript::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

    var words=picked||clean.split(" ").filter(Boolean).slice(0,5).join(" ").replace(/[.,!?]$/,"");
    return {title:cap(words||"Quick note"),project:"Inbox",thesis:cap(thesis),points:points,questions:[],angles:[],risks:[],suggestions:[],actions:[],offline:true};
  }
  function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
  function refine(raw,l){return refineWithAI(raw,l).catch(function(){return refineLocally(raw);});}

  function timeAgo(ts){var s=Math.floor((Date.now()-ts)/1000);if(s<60)return"just now";var m=Math.floor(s/60);if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";}
  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
  function toast(msg){var t=document.getElementById("toast");t.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(function(){t.innerHTML="";},1800);}
  function find(id){for(var i=0;i<notes.length;i++){if(notes[i].id===id)return notes[i];}return null;}
  function openCount(){var c=0;notes.forEach(function(n){(n.actions||[]).forEach(function(a){if(!a.done)c++;});});tasks.forEach(function(t){if(!t.done)c++;});return c;}
  function addTask(text,ventureId){
    text=(text||"").trim();if(!text)return null;
    var t={id:"t_"+Date.now()+"_"+Math.floor(Math.random()*999),text:text,done:false,ventureId:ventureId||null,createdAt:Date.now()};
    tasks.unshift(t);saveNotes();return t;
  }
  function toggleSolo(id){for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].done=!tasks[i].done;break;}}saveNotes();}
  function deleteSolo(id){tasks=tasks.filter(function(t){return t.id!==id;});saveNotes();}
  function addNoteTask(noteId,text){
    var n=find(noteId);if(!n)return;text=(text||"").trim();if(!text)return;
    if(!Array.isArray(n.actions))n.actions=[];
    n.actions.push({id:"a_"+noteId+"_m"+Date.now(),text:text,done:false});
    saveNotes();
  }

  function toggleTask(noteId,actId){var n=find(noteId);if(!n||!n.actions)return;for(var i=0;i<n.actions.length;i++){if(n.actions[i].id===actId){n.actions[i].done=!n.actions[i].done;break;}}saveNotes();}

  function folderById(id){for(var i=0;i<folders.length;i++){if(folders[i].id===id)return folders[i];}return null;}
  function folderName(n){return ventureLabel(n);}
  function notesInFolder(id){return notes.filter(function(n){return n.folderId===id;});}
  function createFolder(name){name=(name||"").trim();if(!name)return null;var f={id:"f_"+Date.now()+"_"+Math.floor(Math.random()*999),name:name};folders.push(f);saveNotes();return f;}

  /* ---- ventures: the business or idea a note belongs to ---- */
  function ventureById(id){for(var i=0;i<ventures.length;i++){if(ventures[i].id===id)return ventures[i];}return null;}
  function notesInVenture(id){return notes.filter(function(n){return n.ventureId===id;});}
  function unfiledNotes(){return notes.filter(function(n){return !n.ventureId||!ventureById(n.ventureId);});}
  function createVenture(name,kind){
    name=(name||"").trim();if(!name)return null;
    var existing=ventures.filter(function(v){return v.name.toLowerCase()===name.toLowerCase();})[0];
    if(existing)return existing;
    var v={id:"v_"+Date.now()+"_"+Math.floor(Math.random()*999),name:name.slice(0,60),kind:kind==="idea"?"idea":"running",createdAt:Date.now()};
    ventures.push(v);return v;
  }
  /* Route a freshly captured note to a venture the model picked (or a new one). */
  function assignVenture(note,v){
    if(!v||!v.name){note.ventureId=null;return;}
    var match=v.id?ventureById(v.id):null;
    if(!match)match=ventures.filter(function(x){return x.name.toLowerCase()===v.name.toLowerCase();})[0];
    if(!match)match=createVenture(v.name,v.kind);
    note.ventureId=match?match.id:null;
  }
  function ventureLabel(n){
    var v=n.ventureId?ventureById(n.ventureId):null;
    if(v)return v.name;
    return n.project||"Unfiled";
  }
  function ventureStats(id){
    var list=notesInVenture(id),open=0,q=0,last=0;
    list.forEach(function(n){
      (n.actions||[]).forEach(function(a){if(!a.done)open++;});
      q+=(n.questions||[]).length;
      if(n.createdAt>last)last=n.createdAt;
    });
    tasks.forEach(function(t){if(t.ventureId===id&&!t.done)open++;});
    return {notes:list.length,open:open,questions:q,last:last};
  }
  function sortedNotes(){
    ensureOrder();
    var list=notes.slice();
    if(sortMode==="oldest")return list.sort(function(a,b){return a.createdAt-b.createdAt;});
    if(sortMode==="manual"){var idx={};manualOrder.forEach(function(id,i){idx[id]=i;});return list.sort(function(a,b){var ia=(a.id in idx)?idx[a.id]:1e9,ib=(b.id in idx)?idx[b.id]:1e9;return ia-ib;});}
    if(sortMode==="venture"){
      var vi={};ventures.forEach(function(v,i){vi[v.id]=i;});
      return list.sort(function(a,b){
        var ia=(a.ventureId&&a.ventureId in vi)?vi[a.ventureId]:1e9,ib=(b.ventureId&&b.ventureId in vi)?vi[b.ventureId]:1e9;
        if(ia!==ib)return ia-ib;
        return b.createdAt-a.createdAt;
      });
    }
    return list.sort(function(a,b){return b.createdAt-a.createdAt;});
  }
  var SORTS={newest:"Newest",oldest:"Oldest",venture:"By business",manual:"Manual"};

    var list=sortedNotes();

  /* Reorder businesses by dragging the grip — order is the array order. */
  function bindVentureDrag(container){
    if(!container)return;
    Array.prototype.forEach.call(container.querySelectorAll(".grip"),function(handle){
      handle.addEventListener("pointerdown",function(e){
        e.preventDefault();
        var card=handle.parentNode;
        card.classList.add("drag");
        try{handle.setPointerCapture(e.pointerId);}catch(_){}
        function move(ev){
          var y=ev.clientY,others=container.querySelectorAll(".vcard:not(.drag)"),placed=false;
          for(var i=0;i<others.length;i++){var r=others[i].getBoundingClientRect();if(y<r.top+r.height/2){container.insertBefore(card,others[i]);placed=true;break;}}
          if(!placed)container.appendChild(card);
        }
        function up(){
          card.classList.remove("drag");
          try{handle.releasePointerCapture(e.pointerId);}catch(_){}
          handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);
          var ids=[];Array.prototype.forEach.call(container.querySelectorAll(".vcard"),function(c){ids.push(c.getAttribute("data-vid"));});
          ventures.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id);});
          saveNotes();
        }
        handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);
      });
    });
  }

  function standupHTML(v){
    if(standupBusy)return '<div class="stand-block"><span class="block-label">Where it stands</span><p class="stand-lead" style="color:var(--muted)">Reading everything you\u2019ve captured\u2026</p></div>';
    var st=standups[v.id];if(!st)return "";
    function sec(label,items,cls){
      if(!items||!items.length)return "";
      return '<div class="dev-block '+cls+'" style="margin-top:14px"><span class="block-label">'+label+'</span><ul class="dev-list">'+items.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';
    }
    return '<div class="stand-block"><span class="block-label">Where it stands</span>'
      +(st.stands?'<p class="stand-lead">'+esc(st.stands)+'</p>':"")
      +sec("Moving",st.moving,"a")+sec("Stuck",st.stuck,"r")+sec("Focus next",st.focus,"q")
      +'</div>';
  }
  function runStandup(v,list){
    if(!v||standupBusy)return;
    standupBusy=true;renderVentureDetail();
    var payload=list.slice().sort(function(a,b){return a.createdAt-b.createdAt;}).map(function(n){
      return {createdAt:n.createdAt,title:n.title,thesis:n.thesis,points:n.points||[],questions:n.questions||[],risks:n.risks||[],actions:(n.actions||[]).map(function(a){return {text:a.text,done:!!a.done};})};
    });
    fetch("/api/standup",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({venture:{name:v.name,kind:v.kind},notes:payload})})
    .then(function(res){if(!res.ok)throw new Error("standup_"+res.status);return res.json();})
    .then(function(j){standups[v.id]=j;saveNotes();})
    .catch(function(err){console.error("[standup]",err);toast("Couldn\u2019t read this one right now");})
    .then(function(){standupBusy=false;renderVentureDetail();});
  }
  function bindCards(scope){

  function noteMatches(n,q){var hay=((n.title||"")+" "+(n.thesis||"")+" "+(n.project||"")+" "+ventureLabel(n)+" "+((n.points||[]).join(" "))+" "+((n.actions||[]).map(function(a){return a.text;}).join(" "))+" "+(n.raw||"")).toLowerCase();return hay.indexOf(q)>=0;}
  function cardHTML(n,showFolder){
    var oc=(n.actions||[]).filter(function(a){return !a.done;}).length;
    var meta="";

      var devs=devSection("Questions to answer",n.questions,"q")+devSection("Angles to consider",n.angles,"a")+devSection("Watch out for",n.risks,"r");
      var rows=(n.actions||[]).map(function(a){return '<button class="action-row taskbtn'+(a.done?" done":"")+'" data-act="'+a.id+'"><span class="acheck'+(a.done?" on":"")+'">'+(a.done?I.check(12):"")+'</span><span>'+esc(a.text)+'</span></button>';}).join("");
      var addBits=addingTask
        ? '<div class="addtask-row" style="margin-top:8px"><input id="noteTaskInput" type="text" placeholder="What needs doing?" autocomplete="off" /><button class="pill-btn" id="noteTaskAdd">Add</button></div>'
        : '<button class="raw-toggle" id="addTaskBtn" style="margin-top:6px">'+I.plus(14)+'Add task</button>';
      var acts='<div class="actions-block"><span class="block-label">Tasks</span>'+(rows||'<p class="thread-empty" style="padding:2px 0 4px">No tasks yet.</p>')+addBits+'</div>';
      var sugg="";
      if(n.suggestions&&n.suggestions.length){
        sugg='<div class="actions-block sugg-block"><span class="block-label">Suggested next steps</span>'
          +n.suggestions.map(function(sx,i){return '<div class="sugg-row"><span class="sugg-text">'+esc(sx)+'</span><span class="sugg-btns"><button class="sugg-add" data-sugg="'+i+'" aria-label="Add as task">'+I.plus(14)+'Add</button><button class="sugg-no" data-nope="'+i+'" aria-label="Dismiss">'+I.x(13)+'</button></span></div>';}).join("")
          +'</div>';
      }
      var raw=showRaw?'<p class="raw-text">'+esc(n.raw)+'</p>':"";
      var fileRow='<div class="file-row"><span class="block-label">Business</span><div class="chips" id="folderChips"><button class="chip'+(!n.ventureId?" on":"")+'" data-fid="">Unfiled</button>'+ventures.map(function(v){return '<button class="chip'+(n.ventureId===v.id?" on":"")+'" data-fid="'+v.id+'">'+esc(v.name)+'</button>';}).join("")+'</div></div>';
      var deepLabel=(n.thread&&n.thread.length)?"Continue ("+n.thread.filter(function(m){return m.role==="user";}).length+")":"Go deeper";
      document.getElementById("modals").innerHTML='<div class="scrim" id="detScrim"><div class="sheet" id="detSheet"><div class="grab"></div><div class="detail-head"><div style="min-width:0">'+(editingTitle?'<div class="newfolder-row" style="margin-bottom:0"><input id="titleInput" type="text" value="'+esc(n.title)+'" maxlength="70" /><button class="pill-btn" id="titleSave">Save</button></div>':'<span class="detail-project">'+esc(folderName(n))+'</span><h2 class="detail-title" id="titleTap">'+esc(n.title)+'</h2>')+'</div><button class="icon-btn" id="detClose">'+I.x(18)+'</button></div><div class="detail-body" style="'+(busy?"opacity:.4":"")+'">'+(n.thesis?'<p class="detail-thesis">'+esc(n.thesis)+'</p>':"")+pts+devs+sugg+acts+fileRow+'<button class="raw-toggle" id="rawToggle">'+I.chevron(14)+(showRaw?"Hide":"Show")+' what you said</button>'+raw+threadPanel(n)+'</div><div class="expand-row"><button class="listen-btn'+(speakingId===n.id?" playing":"")+'" id="listenBtn">'+(speakingId===n.id?I.stopc(15)+'Stop':I.play(15)+'Listen')+'</button><button class="expand-btn" id="goDeeper">'+I.expand(16)+deepLabel+'</button></div><div class="detail-actions"><button class="mini-btn" id="sharpen">'+I.refresh(15)+'Sharpen</button><button class="mini-btn" id="copy">'+I.copy(15)+'Copy</button>'+(confirmDel?'<button class="mini-btn danger on" id="del">'+I.trash(15)+'Sure?</button>':'<button class="mini-btn danger" id="del">'+I.trash(15)+'</button>')+'</div></div></div>';
      document.getElementById("detSheet").onclick=function(e){e.stopPropagation();};
      document.getElementById("detScrim").onclick=closeModals;
      document.getElementById("detClose").onclick=closeModals;
      document.getElementById("rawToggle").onclick=function(){showRaw=!showRaw;render();};
      var tTap=document.getElementById("titleTap");if(tTap)tTap.onclick=function(){editingTitle=true;render();};
      var tIn=document.getElementById("titleInput");
      if(tIn){tIn.focus();tIn.select();
        var saveT=function(){var v=tIn.value.trim();if(v){n.title=v;saveNotes();renderApp();}editingTitle=false;render();};
        document.getElementById("titleSave").onclick=saveT;
        tIn.onkeydown=function(e){if(e.key==="Enter")saveT();else if(e.key==="Escape"){editingTitle=false;render();}};}
      Array.prototype.forEach.call(document.querySelectorAll("#detSheet .sugg-add"),function(b){
        b.onclick=function(){
          var i=parseInt(b.getAttribute("data-sugg"),10);
          var text=n.suggestions[i];if(!text)return;
          n.suggestions.splice(i,1);addNoteTask(n.id,text);
          saveNotes();render();renderApp();toast("Added to tasks");
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll("#detSheet .sugg-no"),function(b){
        b.onclick=function(){
          var i=parseInt(b.getAttribute("data-nope"),10);
          if(isNaN(i))return;n.suggestions.splice(i,1);saveNotes();render();renderApp();
        };
      });
      var atb=document.getElementById("addTaskBtn");if(atb)atb.onclick=function(){addingTask=true;render();};
      var ati=document.getElementById("noteTaskInput");
      if(ati){ati.focus();
        var addA=function(){var v=ati.value.trim();if(v){addNoteTask(n.id,v);renderApp();}addingTask=false;render();};
        document.getElementById("noteTaskAdd").onclick=addA;
        ati.onkeydown=function(e){if(e.key==="Enter")addA();else if(e.key==="Escape"){addingTask=false;render();}};}
      document.getElementById("copy").onclick=function(){try{navigator.clipboard.writeText(noteToText(n));}catch(e){}toast("Copied to clipboard");};
      document.getElementById("listenBtn").onclick=function(){speakNote(n,function(){render();});};
      document.getElementById("goDeeper").onclick=function(){showThread=!showThread;render();};
      Array.prototype.forEach.call(document.querySelectorAll("#folderChips .chip"),function(b){b.onclick=function(){var vid=b.getAttribute("data-fid");n.ventureId=vid?vid:null;saveNotes();render();renderApp();var vn=vid&&ventureById(vid)?ventureById(vid).name:null;toast(vn?("Moved to "+vn):"Unfiled");};});
      Array.prototype.forEach.call(document.querySelectorAll("#detSheet .taskbtn"),function(b){b.onclick=function(){toggleTask(n.id,b.getAttribute("data-act"));render();renderApp();};});
      var del=document.getElementById("del");
      del.onclick=function(){if(!confirmDel){confirmDel=true;render();return;}notes=notes.filter(function(x){return x.id!==id;});manualOrder=manualOrder.filter(function(x){return x!==id;});saveNotes();renderApp();closeModals();};
      document.getElementById("sharpen").onclick=function(){if(busy)return;busy=true;render();refine(n.raw,n.lens).then(function(r){for(var k in r){n[k]=r[k];}normNote(n);saveNotes();busy=false;render();renderApp();toast(r.offline?"Reformatted (offline)":"Sharpened again");});};
      if(showThread){
        var box=document.getElementById("threadBox");if(box)box.scrollTop=box.scrollHeight;
        var inp=document.getElementById("devInput"),snd=document.getElementById("devSend");
        if(snd)snd.onclick=function(){if(inp){var v=inp.value;inp.value="";sendDev(v);}};
        if(inp)inp.onkeydown=function(e){if(e.key==="Enter"){var v=inp.value;inp.value="";sendDev(v);}};
        var starterEls=document.querySelectorAll("#detSheet .starter");
        Array.prototype.forEach.call(starterEls,function(b){b.onclick=function(){sendDev(b.textContent);};});
        if(!devBusy&&inp&&(n.thread||[]).length)inp.focus();
      }
    }
    render();
  }
  function noteToText(n){
    var out=n.title+"\n\n";
    if(n.thesis)out+=n.thesis+"\n\n";
    if(n.points&&n.points.length)out+=n.points.map(function(p){return "\u2022 "+p;}).join("\n")+"\n\n";
    function sec(label,a){return (a&&a.length)?label+":\n"+a.map(function(x){return "\u2022 "+x;}).join("\n")+"\n\n":"";}
    out+=sec("Questions to answer",n.questions);
    out+=sec("Angles to consider",n.angles);
    out+=sec("Watch out for",n.risks);
    out+=sec("Suggested next steps",n.suggestions);
    if(n.actions&&n.actions.length)out+="Tasks:\n"+n.actions.map(function(a){return (a.done?"[x] ":"[ ] ")+a.text;}).join("\n")+"\n\n";
    if(n.thread&&n.thread.length)out+="Deeper thinking:\n"+n.thread.map(function(m){return (m.role==="user"?"You: ":"Lucid: ")+m.text;}).join("\n\n")+"\n\n";
    return out+"\u2014 captured with Lucid";
  }

  /* ---- read aloud ---- */
  var TTS=(typeof window!=="undefined"&&window.speechSynthesis)?window.speechSynthesis:null;
  var speakingId=null, speakCb=null;
  function pickVoice(){
    if(!TTS)return null;
    var vs=TTS.getVoices()||[];
    var prefer=["Samantha","Ava","Serena","Google US English","Microsoft Aria","Microsoft Jenny","Daniel","Karen"];
    for(var p=0;p<prefer.length;p++){for(var i=0;i<vs.length;i++){if(vs[i].name.indexOf(prefer[p])>=0)return vs[i];}}
    for(var j=0;j<vs.length;j++){if(/^en[-_]/i.test(vs[j].lang))return vs[j];}
    return vs[0]||null;
  }
  function noteToSpeech(n){
    var s=n.title+". ";
    if(n.thesis)s+=n.thesis+" ";
    if(n.points&&n.points.length)s+="Key points. "+n.points.join(". ")+". ";
    var open=(n.actions||[]).filter(function(a){return !a.done;});
    if(open.length)s+="Next steps. "+open.map(function(a){return a.text;}).join(". ")+".";
    return s;
  }
  function stopSpeaking(){
    if(TTS){try{TTS.cancel();}catch(e){}}
    var was=speakingId;speakingId=null;
    if(speakCb&&was)speakCb();
  }
  function speakNote(n,onChange){
    if(!TTS){toast("Read aloud isn\u2019t supported here");return;}
    if(speakingId===n.id){stopSpeaking();return;}
    stopSpeaking();
    speakCb=onChange;
    var text=noteToSpeech(n);
    var chunks=text.match(/[^.!?]+[.!?]*/g)||[text];
    var merged=[],buf="";
    chunks.forEach(function(c){if((buf+c).length>180){if(buf)merged.push(buf);buf=c;}else buf+=c;});
    if(buf)merged.push(buf);
    speakingId=n.id;
    if(onChange)onChange();
    var v=pickVoice(),idx=0;
    var next=function(){
      if(speakingId!==n.id||idx>=merged.length){if(speakingId===n.id){speakingId=null;if(onChange)onChange();}return;}
      var u=new SpeechSynthesisUtterance(merged[idx++].trim());
      if(v)u.voice=v;
      u.rate=1.0;u.pitch=1.0;u.lang=(v&&v.lang)||"en-US";
      u.onend=next;
      u.onerror=function(){if(speakingId===n.id){speakingId=null;if(onChange)onChange();}};
      try{TTS.speak(u);}catch(e){speakingId=null;if(onChange)onChange();}
    };
    next();
  }
  if(TTS&&typeof TTS.onvoiceschanged!=="undefined"){TTS.onvoiceschanged=function(){pickVoice();};}

  function openSettings(){
    var connected=false;
    document.getElementById("modals").innerHTML=
      '<div class="scrim" id="setScrim"><div class="sheet" id="setSheet"><div class="grab"></div>'
      +'<div class="sheet-head"><span class="sheet-title">Settings</span><button class="icon-btn" id="setClose">'+I.x(18)+'</button></div>'
      +'<span class="block-label" style="display:block;margin:2px 2px 12px">Sync &amp; backup</span>'
      +'<button class="set-row" id="setDrive"><span class="set-ic">'+I.cloud(20)+'</span><span class="set-main"><span class="set-title">Save to Google Drive</span><span class="set-sub">Download a backup and open Drive to drop it in.</span></span></button>'
      +'<button class="set-row" id="setBackup"><span class="set-ic">'+I.download(19)+'</span><span class="set-main"><span class="set-title">Back up to a file</span><span class="set-sub">Save all notes, folders and tasks as one file.</span></span></button>'
      +'<button class="set-row" id="setRestore"><span class="set-ic">'+I.upload(19)+'</span><span class="set-main"><span class="set-title">Restore from a file</span><span class="set-sub">Replace everything with a backup you saved.</span></span></button>'
      +'<input type="file" id="setFile" accept="application/json,.json" style="display:none" />'
      +'<p class="set-note">Live two-way Google Drive sync needs the app hosted online with sign-in. Until then, a backup file kept in your Drive gives you the same safety net across devices.</p>'
      +'</div></div>';
    document.getElementById("setSheet").onclick=function(e){e.stopPropagation();};
    document.getElementById("setScrim").onclick=closeModals;
    document.getElementById("setClose").onclick=closeModals;
    document.getElementById("setBackup").onclick=function(){doBackup();toast("Backup downloaded");};
    document.getElementById("setDrive").onclick=function(){doBackup();try{window.open("https://drive.google.com/drive/my-drive","_blank");}catch(e){}toast("Backup saved \u2014 opening Drive");};
    var file=document.getElementById("setFile");
    document.getElementById("setRestore").onclick=function(){file.click();};
    file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var data=JSON.parse(rd.result);applyState(data);notes=notes.map(normNote);ensureOrder();saveNotes();closeModals();view="library";renderApp();toast("Restored from backup");}catch(e){toast("Couldn\u2019t read that file");}};rd.readAsText(f);};
  }
  function doBackup(){
    try{
      var blob=new Blob([JSON.stringify(stateObj(),null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var d=new Date(),pad=function(x){return (x<10?"0":"")+x;};
      a.href=url;a.download="lucid-notes-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    }catch(e){toast("Backup failed on this device");}
  }

  /* ---- boot ---- */
  document.getElementById("fab").innerHTML=I.mic(24);
  document.getElementById("fab").onclick=function(){openCapture(true);};
  var setBtn=document.getElementById("settingsBtn");
  setBtn.innerHTML=I.gear(17);
  setBtn.onclick=openSettings;
  document.body.addEventListener("click",function(){if(lensMenuOpen){lensMenuOpen=false;renderLensChip();}});
  renderLensChip();
  loadNotes(function(){notes=notes.map(normNote);ensureOrder();renderApp();});
})();
</script>
